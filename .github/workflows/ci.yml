name: ci
on:
  push:
    branches: [next, main]
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm check:headers
      - run: pnpm --filter @voysemble/organizer-web exec playwright install --with-deps chromium
      - run: pnpm --filter @voysemble/organizer-web test:e2e
      # Public site (apps/public-web): built by its own script, served by the assets-only Worker.
      - run: pnpm --filter @voysemble/public-web test:e2e
        env:
          BUILD_ID: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-captures
          path: |
            docs/captures/web
            docs/captures/public
          if-no-files-found: ignore
  mobile:
    # GitHub Ubuntu runners ship the Android SDK and can reach Google Maven, so the full build
    # runs here (core JVM + Android targets, android-app). iOS targets are skipped on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # One invocation: the unit tests run once, in Roborazzi record mode, so the screenshot tests
      # write docs/captures/android/ (a second invocation found the tests up to date and recorded
      # nothing, run 38196420393). D31 makes the captures a gate: the job fails without them.
      - run: ./gradlew build :android-app:recordRoborazziDebug --console=plain
        working-directory: mobile
      - run: ls docs/captures/android/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-captures
          path: docs/captures/android
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-test-reports
          path: mobile/**/build/reports/tests
          if-no-files-found: ignore
  ios:
    # iOS verification on a macOS runner: XcodeGen project, Gradle-built VoysembleCore framework
    # (SKIE), xcodebuild + XCTest on the simulator. No Android SDK here, so the Xcode pre-build
    # script passes -Pvoysemble.android=false via VOYSEMBLE_ANDROID. macOS 26 (slice 037, D32):
    # its default Xcode 26 carries the iOS 26 SDK and simulator, so Liquid Glass compiles
    # (Swift 6.2) and the captures render it; macOS 15's Xcode 16.4 built the flat fallback.
    runs-on: macos-26
    env:
      VOYSEMBLE_ANDROID: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: xcodebuild -version && xcrun simctl list runtimes
      # Pick whatever iPhone simulator the image ships (names change between Xcode releases);
      # download the iOS platform first when the image has no runtime at all.
      - name: Pick an iPhone simulator
        run: |
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          devs = [d for rt, ds in data.items() if "iOS" in rt for d in ds if d.get("isAvailable") and "iPhone" in d["name"]]
          print(devs[-1]["udid"] if devs else "")'
          }
          UDID="$(pick)"
          if [ -z "$UDID" ]; then
            xcodebuild -downloadPlatform iOS
            UDID="$(pick)"
          fi
          test -n "$UDID" || { echo "no iPhone simulator available"; xcrun simctl list devices; exit 1; }
          echo "Using simulator $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: mobile/ios-app
      # Warm the framework outside Xcode first so Gradle/Kotlin/Native download failures show up
      # as their own step, not inside a script phase.
      - run: ./gradlew :core:linkDebugFrameworkIosSimulatorArm64 -Pvoysemble.android=false --console=plain
        working-directory: mobile
      - run: |
          xcodebuild test \
            -project Voysemble.xcodeproj \
            -scheme Voysemble \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee xcodebuild.log | grep -E "error:|warning: unre|Test Case|Executed|BUILD|TEST" || true
          grep -qE "\*\* TEST SUCCEEDED \*\*" xcodebuild.log
        working-directory: mobile/ios-app
      # D31: the capture tests must have written the screens.
      - run: ls docs/captures/ios/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: mobile/ios-app/xcodebuild.log
          if-no-files-found: ignore
      # Screen captures written by VoysembleTests/CaptureTests.swift (D31).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-captures
          path: docs/captures/ios
          if-no-files-found: ignore
  # Slice 089: every green push to `next` deploys staging (deploy.yml); it skips cleanly until the
  # Cloudflare secrets and the D1 id variable exist (docs/runbooks/cloudflare.md §3–4).
  deploy-staging:
    needs: [web, mobile, ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit
  # D31: the captures every job recorded are committed back to the branch so docs/captures/ is
  # always the current state of every client. Runs only when every job passed (captures of a red
  # build are not evidence), only on push (a pull_request checkout has no branch to push to), and
  # marks its commit [skip ci] so it never triggers itself.
  captures:
    needs: [web, mobile, ios]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-captures
          path: docs/captures
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-captures
          path: docs/captures/android
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-captures
          path: docs/captures/ios
      - name: Commit captures
        run: |
          git config user.name "voysemble-ci"
          git config user.email "ci@voysemble.com"
          git add -A docs/captures
          if git diff --cached --quiet; then
            echo "captures unchanged"
            exit 0
          fi
          git commit -m "chore(captures): record device captures for ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
