name: ci
on:
  push:
    branches: [next, main]
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm check:headers
      - run: pnpm --filter @voysemble/organizer-web exec playwright install --with-deps chromium
      - run: pnpm --filter @voysemble/organizer-web test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-captures
          path: docs/captures/web
          if-no-files-found: ignore
  mobile:
    # GitHub Ubuntu runners ship the Android SDK and can reach Google Maven, so the full build
    # runs here (core JVM + Android targets, android-app). iOS targets are skipped on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --console=plain
        working-directory: mobile
      # Screenshot evidence for the mobile Today screen (Robolectric + Roborazzi, 412x915).
      - run: ./gradlew :android-app:recordRoborazziDebug --console=plain
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-captures
          path: docs/captures/android
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-test-reports
          path: mobile/**/build/reports/tests
          if-no-files-found: ignore
  ios:
    # iOS verification on a macOS runner: XcodeGen project, Gradle-built VoysembleCore framework
    # (SKIE), xcodebuild + XCTest on the simulator. No Android SDK here, so the Xcode pre-build
    # script passes -Pvoysemble.android=false via VOYSEMBLE_ANDROID.
    runs-on: macos-15
    env:
      VOYSEMBLE_ANDROID: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: xcodebuild -version && xcrun simctl list runtimes
      # Pick whatever iPhone simulator the image ships (names change between Xcode releases);
      # download the iOS platform first when the image has no runtime at all.
      - name: Pick an iPhone simulator
        run: |
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          devs = [d for rt, ds in data.items() if "iOS" in rt for d in ds if d.get("isAvailable") and "iPhone" in d["name"]]
          print(devs[-1]["udid"] if devs else "")'
          }
          UDID="$(pick)"
          if [ -z "$UDID" ]; then
            xcodebuild -downloadPlatform iOS
            UDID="$(pick)"
          fi
          test -n "$UDID" || { echo "no iPhone simulator available"; xcrun simctl list devices; exit 1; }
          echo "Using simulator $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: mobile/ios-app
      # Warm the framework outside Xcode first so Gradle/Kotlin/Native download failures show up
      # as their own step, not inside a script phase.
      - run: ./gradlew :core:linkDebugFrameworkIosSimulatorArm64 -Pvoysemble.android=false --console=plain
        working-directory: mobile
      - run: |
          xcodebuild test \
            -project Voysemble.xcodeproj \
            -scheme Voysemble \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee xcodebuild.log | grep -E "error:|warning: unre|Test Case|Executed|BUILD|TEST" || true
          grep -qE "\*\* TEST SUCCEEDED \*\*" xcodebuild.log
        working-directory: mobile/ios-app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: mobile/ios-app/xcodebuild.log
          if-no-files-found: ignore
