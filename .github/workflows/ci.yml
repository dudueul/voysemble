name: ci
on:
  push:
    branches: [next, main]
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm check:headers
      - run: pnpm --filter @voysemble/organizer-web exec playwright install --with-deps chromium
      - run: pnpm --filter @voysemble/organizer-web test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-captures
          path: docs/captures/web
          if-no-files-found: ignore
  mobile:
    # GitHub Ubuntu runners ship the Android SDK and can reach Google Maven, so the full build
    # runs here (core JVM + Android targets, android-app). iOS targets are skipped on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --console=plain
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-test-reports
          path: mobile/**/build/reports/tests
          if-no-files-found: ignore
