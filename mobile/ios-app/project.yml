#
# XcodeGen spec. Generate the Xcode project on macOS:
#   brew install xcodegen && cd mobile/ios-app && xcodegen generate
# The generated .xcodeproj is gitignored; this file is the source of truth.
# The VoysembleCore framework is built by Gradle (:core) in a pre-build script phase.
# CI builds and tests this project on a macOS runner (.github/workflows/ci.yml, job `ios`).
name: Voysemble
options:
  bundleIdPrefix: com.voysemble
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    # Swift 5 language mode: Kotlin/Native (ObjC) types are not Sendable, and Swift 6 strict
    # concurrency rejects every async call into the framework. Revisit when SKIE marks results.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../core/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
targets:
  Voysemble:
    type: application
    platform: iOS
    sources:
      - path: Voysemble
    info:
      path: Voysemble/Info.plist
      properties:
        CFBundleDisplayName: Voysemble
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        # Meeting windows (D15, slice 029): one fix while the traveler shares inside an open window,
        # judged on the phone; no background location.
        NSLocationWhenInUseUsageDescription: Voysemble compares your position with the meeting point only while you share inside an open meeting window. Your position never leaves this phone; leaders see inside or outside.
        VYApiHostDebug: api.next.dev.voysemble.cfd
        VYApiHostRelease: api.voysemble.com
    preBuildScripts:
      - name: Build VoysembleCore (Gradle)
        script: |
          cd "$SRCROOT/.."
          # VOYSEMBLE_ANDROID=false skips the Android included build on hosts without an SDK (CI macOS).
          ./gradlew :core:embedAndSignAppleFrameworkForXcode -Pvoysemble.android="${VOYSEMBLE_ANDROID:-true}" --console=plain
        inputFiles: []
        outputFiles: []
    # Universal Links (slice 019): the magic link opens the app, which verifies the token. The
    # association file is served by the Worker at /.well-known/apple-app-site-association; the
    # entitlement needs a provisioning profile with Associated Domains on device (not on the
    # simulator, where CI builds with signing off).
    entitlements:
      path: Voysemble/Voysemble.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:app.voysemble.com
          - applinks:next.dev.voysemble.cfd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voysemble.app
        OTHER_LDFLAGS: "$(inherited) -framework VoysembleCore"
  VoysembleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VoysembleTests
    dependencies:
      - target: Voysemble
